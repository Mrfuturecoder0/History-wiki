<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title><!-- TITLE --></title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <main>
    <article>
      <h1><!-- TITLE --></h1>
      <div class="meta">
        <span><strong>Status:</strong> <!-- Draft / Reviewed / Disputed / Curated --></span>
        <span><strong>Contributor:</strong> <!-- Name --></span>
        <span><strong>Date:</strong> <!-- YYYY-MM-DD --></span>
        <span><strong>Subject type:</strong> <!-- Person / Event / Lineage / Institution --></span>
        <span><strong>Time period:</strong> <!-- e.g., 1769–1821 --></span>
        <span><strong>Geography:</strong> <!-- e.g., France, Europe --></span>
        <span><strong>Confidence:</strong> <!-- Confirmed / Disputed / Traditional / Speculative --></span>
      </div>
      <iframe
        class="pdf-frame"
        src="../pdfs/<!-- filename.pdf -->"
        title="Embedded dossier PDF"
        loading="lazy"
        referrerpolicy="no-referrer">
      </iframe>
    </article>
  </main>
</body>
</html>
